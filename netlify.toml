# Headers only: build settings stay in the Netlify UI. Netlify serves public/
# files directly, so next.config.ts headers do not reach them.

# Generated images are named by a hash of their content and settings
# (scripts/build-images.mjs), so they can be cached for a year.
[[headers]]
  for = "/profile/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

