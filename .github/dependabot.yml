version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Netlify builds only with approval: the marker keeps Dependabot commits
    # (and merge commits that quote their titles) from deploying.
    commit-message:
      prefix: '[skip netlify]'
    # Major upgrades (Next.js, React, ESLint, TypeScript) are planned
    # deliberately and land in a named release, not raised automatically.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: '[skip netlify]'
    groups:
      actions:
        patterns:
          - '*'
